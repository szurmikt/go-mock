<div class="widget" (click)="openPage()">
  <div class="widget-header">
    <div class="widget-icon">
      <ion-img src="assets/icon/icon-comment-blue.svg"></ion-img>
    </div>
    <div class="widget-title">
      {{ 'guestFeedbackWidget.pageTitle' | translateIT }}
    </div>
  </div>
  <div class="widget-content">
    <ion-grid>
      <ion-row>
        <ion-col
          class="display-flex flex-column align-items-start justify-content-center flex-grow-1"
        >
          <div class="label">
            {{ 'guestFeedbackWidget.avarage' | translateIT }}
          </div>
          <div class="data green">9.58</div>
        </ion-col>
        <ion-col
          class="display-flex flex-column align-items-end flex-basis-auto width-auto flex-grow-1 flex-shrink-1"
        >
          <div class="label">
            {{ 'guestFeedbackWidget.needAttention' | translateIT }}
          </div>
          <div class="data red">
            2 {{ 'guestFeedbackWidget.feedback' | translateIT }}
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</div>
