<ion-header>
  <ion-toolbar>
    <ion-title>Document Reader</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-text>
    <h2>Status: {{ reader.status$ | async }}</h2>
  </ion-text>

  <ion-button expand="block" (click)="reader.scan()"> Scan </ion-button>

  <ion-button expand="block" (click)="reader.recognize()">
    Recognize
  </ion-button>

  <ion-item>
    <ion-checkbox
      slot="start"
      [disabled]="!(reader.canRfid$ | async)"
      [checked]="reader.doRfid"
      (ionChange)="reader.toggleRfid()"
    >
    </ion-checkbox>
    <ion-label>Process RFID reading</ion-label>
  </ion-item>

  <ion-list>
    <ion-radio-group [value]="reader.selectedScenario">
      <ion-item *ngFor="let s of reader.scenarios$ | async">
        <ion-radio
          slot="start"
          [value]="s.name"
          (click)="reader.setScenario(s.name)"
        >
        </ion-radio>
        <ion-label>{{ s.caption }}</ion-label>
      </ion-item>
    </ion-radio-group>
  </ion-list>

  <ion-grid>
    <ion-row>
      <ion-col>
        <img [src]="reader.portrait$ | async" />
      </ion-col>
      <ion-col>
        <img [src]="reader.documentImage$ | async" />
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
