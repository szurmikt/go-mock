<ion-grid class="widget">
  <div class="spinner-wrapper" *ngIf="fetching">
    <ion-spinner color="light" name="dots"></ion-spinner>
  </div>
  <ion-row>
    <ion-col>
      <h2>Arrivals</h2>
    </ion-col>
  </ion-row>
  <ion-row class="day-buttons">
    <ion-col *ngFor="let day of availableDays">
      <ion-button
        [ngClass]="{'active':activeDay == day.day}"
        (click)="changeDay(day);"
      >
        {{day.title}}
      </ion-button>
    </ion-col>
  </ion-row>
  <ion-row class="day-data">
    <ion-col size="auto">
      <div class="label">Reservations</div>
      <div class="data">{{data_reservations}}</div>
    </ion-col>
    <ion-col size="auto">
      <div class="label">Guests</div>
      <div class="data">{{data_guests}}</div>
    </ion-col>
    <ion-col size="auto">
      <div class="label">Amount Due (EUR)</div>
      <div class="data">{{data_amount}}</div>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col> </ion-col>
  </ion-row>
</ion-grid>
