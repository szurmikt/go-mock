<div class="widget" (click)="openPage()">
  <div class="widget-header">
    <div class="widget-icon">
      <ion-img src="assets/icon/icon-occupancy-rate.svg"></ion-img>
    </div>
    <div class="widget-title">
      {{ 'occupancyWidget.pageTitle' |
      translateIT:(languageService.translations$ | async) }}
    </div>
  </div>
  <div class="widget-content">
    <ion-grid>
      <ion-row>
        <ion-col
          class="display-flex flex-column align-items-start justify-content-center flex-grow-1"
        >
          <span class="green"
            >{{ 'occupancyWidget.percentFromYesterday' | translateIT :
            (languageService.translations$ | async) : {percent: '+2.3'} }}</span
          >
        </ion-col>
        <ion-col class="flex-basis-auto width-auto flex-grow-0 flex-shrink-1">
          <ion-img
            class="occupancy-rate"
            src="assets/occupancy-rate.svg"
          ></ion-img>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</div>
