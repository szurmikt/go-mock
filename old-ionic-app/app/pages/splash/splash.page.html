<!-- @if (!initialized) { -->
@if (loading) {
  <div class="loader">
    <div class="spinner-container">
      <ion-spinner></ion-spinner>
    </div>
    <div class="log-container">
      <div class="log">
        @for (item of logData; track item) {
          <div class="item">{{item}}</div>
        }
      </div>
      <div class="cover"></div>
    </div>
  </div>
}
<!-- } -->
