<ion-content
  [fullscreen]="false"
  class="page-container"
  [ngClass]="{ ios: isiOS() }"
  ><ion-grid>
  <ion-row>
    <ion-col>
      <h1>Status</h1>
      <div class="button-close" (click)="dismissModal()">
        <ion-img src="assets/icon/icon-close.svg"></ion-img>
      </div>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
      <ion-toggle
        value="tab.enabled"
        [disabled]="tab.id == 'tab1'"
        [checked]="tab.enabled"
        (ionChange)="setStatus()"
      ></ion-toggle>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
      <h1>Icon</h1>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col class="icons">
      @for (icon of icons; track icon) {
        <ion-img
          src="{{ icon }}"
          [ngClass]="icon == tab.icon ? 'selected' : ''"
          (click)="setIcon(icon)"
          />
      }
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
      <h1>Views</h1>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col class="views">
      <ion-list>
        @for (view of views; track view) {
          <ion-item
            [ngClass]="view.id == tab.view ? 'selected' : ''"
            (click)="setView(view.id)"
            >{{ view.title }}</ion-item
            >
          }
        </ion-list>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <h1>Actions</h1>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
