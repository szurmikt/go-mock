<div class="language-switcher" [ngClass]="full ? 'full' : ''">
  <div class="current-language" (click)="open()">
    {{ full ? currentLanguageFull : currentLanguage }}
  </div>
  <form [formGroup]="form">
    <ion-select
      #languagesSelectRef
      label="Languages"
      label-placement="floating"
      formControlName="selectedLanguage"
      (ionChange)="change($event)"
      style="display: none"
    >
      @for (language of languages; track language) {
        <ion-select-option [value]="language.code">{{
          language.name
        }}</ion-select-option>
      }
    </ion-select>
  </form>
</div>
