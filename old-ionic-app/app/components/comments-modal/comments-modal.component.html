<div class="modal">
  <ion-grid style="margin: 1em">
    <ion-row style="margin-bottom: 1em">
      <ion-col> Comments for reservation {{ reservation?.id }} </ion-col>
    </ion-row>
    <ion-row class="ion-justify-content-center buttons">
      <ion-col class="ion-justify-content-center">
        <ion-button fill="clear" color="secondary" (click)="close()"
          >Close</ion-button
        >
      </ion-col>
    </ion-row>
  </ion-grid>
</div>
