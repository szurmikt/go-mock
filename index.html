const VALID_OTP      = "444555";

const LANGS = [
  { code: "en", label: "EN" },
  { code: "hu", label: "HU" },
  { code: "de", label: "DE" },
  { code: "tr", label: "TR" },
  { code: "fr", label: "FR" },
  { code: "lv", label: "LV" },
  { code: "es", label: "ES" },
];

function LoginScreen({ go, goHome }) {
  const [lang, setLang]       = useState("en");
  const [email, setEmail]     = useState("");
  const [password, setPassword] = useState("");
  const [error, setError]     = useState(false);
  const [loading, setLoading] = useState(false);
  const passwordRef           = useRef(null);

  const submit = (e) => {
    e.preventDefault();
    if (loading) return;
    if (!email && !password) { goHome(); return; }
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      if (email.trim() === VALID_EMAIL && password === VALID_PASSWORD) {
        go("mfa");
      } else {
        setError(true);
      }
    }, 600);
  };

  const retry = () => {
    setError(false);
    setPassword("");
    setTimeout(() => passwordRef.current?.focus(), 50);
  };

  return (
    <div className="login-page">
      <div className="login-header">
        <select className="lang-select" value={lang} onChange={e => setLang(e.target.value)}>
          {LANGS.map(l => (
            <option key={l.code} value={l.code}>{l.label}</option>
          ))}
        </select>
      </div>

      <div className="login-body">
        <div style={{ textAlign: "center", marginBottom: 40 }}>
          <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--primary)", marginBottom: 8 }}>SabeeApp Go</div>
          <div style={{ fontSize: 28, fontWeight: 800, color: "var(--ink)", letterSpacing: "-0.02em", lineHeight: 1.15 }}>Welcome back</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: "var(--ink-4)", marginTop: 6 }}>Sign in to your account</div>
        </div>

        <form onSubmit={submit}>
          <div className="form-group">
            <input
              placeholder=" "
              type="email"
              value={email}
              onChange={e => setEmail(e.target.value)}
              autoComplete="email"
            />
            <label>Email</label>
          </div>

          <div className="form-group" style={{ marginBottom: 24 }}>
            <input
              ref={passwordRef}
              placeholder=" "
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              autoComplete="current-password"
            />
            <label>Password</label>
          </div>

          <button
            className="btn"
            type="submit"
            disabled={loading}
            style={{ opacity: 1 }}
          >
            {loading
              ? <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 18, height: 18, border: "2.5px solid rgba(255,255,255,0.4)", borderTopColor: "#fff", borderRadius: "50%", animation: "spin 0.8s linear infinite", display: "inline-block" }} />
                  Signing in…
                </span>
              : "Sign in"
            }
          </button>
        </form>
      </div>

      <div className="login-footer">
        Account management is handled through your SabeeApp PMS
      </div>

      {error && (
        <div className="sheet-backdrop" onClick={retry}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>Sign in failed</h3>
              <button className="icon-btn" onClick={retry}><I.X /></button>
            </div>
            <div style={{ marginTop: 16, marginBottom: 8 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: "var(--ink-3)", lineHeight: 1.5 }}>
                The email or password you entered is incorrect. Please check your credentials and try again.
              </div>
            </div>

              <button className="btn" onClick={retry}>Try again</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MFAScreen({ goHome, back }) {
  const [digits, setDigits] = useState(["", "", "", "", "", ""]);
  const [error, setError]   = useState(false);
  const [loading, setLoading] = useState(false);
  const inputRefs = [useRef(), useRef(), useRef(), useRef(), useRef(), useRef()];

  useEffect(() => {
    const t = setTimeout(() => inputRefs[0].current?.focus(), 350);
    return () => clearTimeout(t);
  }, []);

  const verify = (d) => {
    const code = d.join("");
    setLoading(true);
    setTimeout(() => {
      if (code === VALID_OTP) {
        goHome();
      } else {
        setLoading(false);
        setError(true);
        setDigits(["", "", "", "", "", ""]);
        setTimeout(() => inputRefs[0].current?.focus(), 50);
      }
    }, 600);
  };

  const handleKey = (i, e) => {
    if (e.key === "Backspace") {
      e.preventDefault();
      const next = [...digits];
      if (next[i]) {
        next[i] = "";
        setDigits(next);
      } else if (i > 0) {
        next[i - 1] = "";
        setDigits(next);
        inputRefs[i - 1].current?.focus();
      }
      setError(false);
    }
  };

  const handleChange = (i, e) => {
    if (loading) return;
    const val = e.target.value.replace(/\D/g, "").slice(-1);
    const next = [...digits];
    next[i] = val;
    setDigits(next);
    setError(false);
    if (val && i < 5) {
      inputRefs[i + 1].current?.focus();
    } else if (val && i === 5) {
      verify(next);
    }
  };

  const handlePaste = (e) => {
    e.preventDefault();
    const pasted = e.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
    if (!pasted) return;
    const next = ["", "", "", "", "", ""];
    for (let i = 0; i < pasted.length; i++) next[i] = pasted[i];
    setDigits(next);
    setError(false);
    if (pasted.length === 6) {
      verify(next);
    } else {
      inputRefs[Math.min(pasted.length, 5)].current?.focus();
    }
  };

  return (
    <div className="page">
      <div className="sub-header">
        <button className="back" onClick={back}><I.ChevronBack /></button>
        <span className="title">Two-step verification</span>
      </div>

      <div style={{ padding: "48px var(--pad) 0", textAlign: "center" }}>
        <div style={{ width: 64, height: 64, borderRadius: "50%", background: "var(--primary-soft-bg)", border: "1.5px solid var(--primary-soft)", display: "inline-flex", alignItems: "center", justifyContent: "center", color: "var(--primary)", marginBottom: 20 }}>
          <I.IDCard style={{ width: 30, height: 30 }} />
        </div>
        <div style={{ fontSize: 15, fontWeight: 600, color: "var(--ink-3)", lineHeight: 1.5, marginBottom: 40 }}>
          Enter the 6-digit code from<br />your authenticator app
        </div>

        <div className="otp-row" style={{ marginBottom: 20 }}>
          {digits.map((d, i) => (
            <React.Fragment key={i}>
              {i === 3 && <span className="otp-sep">·</span>}
              <input
                ref={inputRefs[i]}
                className={"otp-digit" + (d ? " filled" : "") + (error ? " error" : "")}
                type="tel"
                inputMode="numeric"
                maxLength={1}
                value={d}
                disabled={loading}
                onChange={e => handleChange(i, e)}
                onKeyDown={e => handleKey(i, e)}
                onPaste={i === 0 ? handlePaste : undefined}
              />
            </React.Fragment>
          ))}
        </div>

        <div style={{ height: 28, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {loading && (
            <span style={{ width: 20, height: 20, border: "2.5px solid var(--line-strong)", borderTopColor: "var(--primary)", borderRadius: "50%", animation: "spin 0.8s linear infinite", display: "inline-block" }} />
          )}
          {error && !loading && (
            <span>
              <span style={{ fontSize: 14, fontWeight: 700, color: "var(--warn)" }}>Invalid code. </span>
              <button onClick={() => { setError(false); setTimeout(() => inputRefs[0].current?.focus(), 50); }}
                style={{ background: "none", border: "none", fontSize: 14, fontWeight: 700, color: "var(--primary)", cursor: "pointer", padding: 0 }}>
                Try again
              </button>
            </span>
          )}
        </div>
      </div>
    </div>
  );
}

window.MFAScreen   = MFAScreen;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.

    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

  <script type="text/babel">
/* global React, ReactDOM, I, StatusBar, Toast, LoginScreen, MFAScreen, PropertySelectScreen, HomeScreen, ArrivalsScreen, ReservationDetailScreen, GuestDetailScreen, EditGuestScreen, SearchScreen, IDScanScreen, useTweaks, TweaksPanel, TweakSection, TweakRadio */

const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfy",
  "card": "outlined",
  "pill": "soft"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [stack, setStack] = useState([{ name: "login" }]);
  const [direction, setDirection] = useState("forward");
  const [tab, setTab] = useState("home");
  const [toasts, setToasts] = useState([]);
  const [property, setProperty] = useState(null);

  const top = stack[stack.length - 1];

  const go = (name, payload) => {
    setDirection("forward");
    setStack(s => [...s, { name, payload }]);
  };
  const back = () => {
    if (stack.length <= 1) return;
    setDirection("back");
    setStack(s => s.slice(0, -1));
  };
  const setRootTab = (name) => {
    setTab(name);
    setDirection("forward");
    if (name === "home") setStack([{ name: "home" }]);
    else if (name === "arrivals") setStack([{ name: "arrivals" }]);
    else if (name === "search") setStack([{ name: "search" }]);
    else if (name === "scan") setStack([{ name: "idscan" }]);
  };

  const addToast = (msg) => {
    const id = Math.random();
    setToasts(t => [...t, { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2200);
  };

  const renderScreen = (s) => {
    if (!s) return null;
    switch (s.name) {
      case "login":    return <LoginScreen go={go} goHome={() => setStack([{ name: "property" }])} />;
      case "mfa":      return <MFAScreen goHome={() => setStack([{ name: "property" }])} back={back} />;
      case "property": return <PropertySelectScreen onSelect={p => { setProperty(p); setStack([{ name: "home" }]); }} />;
      case "home": return <HomeScreen go={go} property={property} setProperty={setProperty} />;
      case "arrivals": return <ArrivalsScreen go={go} back={back} />;
      case "reservation": return <ReservationDetailScreen id={s.payload} go={go} back={back} addToast={addToast} />;
      case "guest": return <GuestDetailScreen resId={s.payload.resId} guestId={s.payload.guestId} go={go} back={back} />;
      case "editguest": return <EditGuestScreen resId={s.payload.resId} guestId={s.payload.guestId} back={back} addToast={addToast} />;
      case "search": return <SearchScreen back={back} go={go} />;
      case "idscan": return <IDScanScreen back={back} addToast={addToast} />;
      case "blockdate": return <BlockDateScreen back={back} addToast={addToast} />;
      default: return null;
    }
  };

  // Bottom nav visibility — hide on full-screen modals like ID scan
  const showNav = false;

  return (
    <div className="app-stage">
      <div className="app-window"
        data-density={tweaks.density}
        data-card={tweaks.card}
        data-pill={tweaks.pill}>
        <div style={{ position: "relative", flex: 1, overflow: "hidden" }}>
          <PageTransitions stack={stack} direction={direction} renderScreen={renderScreen} />
          <div className="toast-stack">
            {toasts.map(t => <Toast key={t.id} msg={t.msg} />)}
          </div>
        </div>
        {showNav && <BottomNav active={top.name} setRootTab={setRootTab} />}
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Density">
          <TweakRadio value={tweaks.density} options={[{value: "comfy", label: "Comfy"}, {value: "compact", label: "Compact"}]} onChange={v => setTweak("density", v)} />
        </TweakSection>
        <TweakSection title="Card style">
          <TweakRadio value={tweaks.card} options={[{value: "outlined", label: "Outlined"}, {value: "soft", label: "Soft"}, {value: "elevated", label: "Elevated"}]} onChange={v => setTweak("card", v)} />
        </TweakSection>
        <TweakSection title="Status pill">
          <TweakRadio value={tweaks.pill} options={[{value: "soft", label: "Soft"}, {value: "solid", label: "Solid"}, {value: "outline", label: "Outline"}]} onChange={v => setTweak("pill", v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

function PageTransitions({ stack, direction, renderScreen }) {
  // Render last 2 stack frames during transition
  const [rendered, setRendered] = useState(stack);
  const prevLen = useRef(stack.length);

  useEffect(() => {
    if (stack.length === prevLen.current && stack[stack.length - 1] === rendered[rendered.length - 1]) return;
    setRendered(stack);
    prevLen.current = stack.length;
  }, [stack]);

  const top = rendered[rendered.length - 1];
  return (
    <div style={{ position: "absolute", inset: 0 }}>
      <PageHost key={top ? top.name + JSON.stringify(top.payload || "") : "x"} direction={direction}>
        {renderScreen(top)}
      </PageHost>
    </div>
  );
}

function PageHost({ children, direction }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const enterClass = direction === "back" ? "page-back-enter" : "page-enter";
    const activeClass = direction === "back" ? "page-back-enter-active" : "page-enter-active";
    el.classList.add(enterClass);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.classList.add(activeClass);
        el.classList.remove(enterClass);
      });
    });
    const t = setTimeout(() => el.classList.remove(activeClass), 360);
    return () => clearTimeout(t);
  }, []);
  return (
    <div ref={ref} style={{ position: "absolute", inset: 0 }}>
      {children}
    </div>
  );
}

function BottomNav({ active, setRootTab }) {
  const items = [
    { id: "home", label: "Home", Icon: I.Home, IconActive: I.HomeFill },
    { id: "arrivals", label: "Arrivals", Icon: I.ArrowIn, IconActive: I.ArrowIn },
    { id: "scan", label: "Scan", Icon: I.Scan, IconActive: I.Scan },
    { id: "search", label: "Search", Icon: I.Search, IconActive: I.Search },
  ];
  return (
    <div className="bottom-nav">
      {items.map(it => {
        const isActive = it.id === active || (it.id === "arrivals" && active === "arrivals");
        const Icon = isActive ? it.IconActive : it.Icon;
        return (
          <button key={it.id} className={"nav-item" + (isActive ? " active" : "")} onClick={() => setRootTab(it.id)}>
            <Icon className="nav-icon" />
            <span>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function BlockDateScreen({ back, addToast }) {
  const today = new Date();
  const [start, setStart] = useState(null);
  const [end, setEnd] = useState(null);
  const days = [];
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  const lead = (first.getDay() + 6) % 7;
  for (let i = 0; i < lead; i++) days.push(null);
  const total = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  for (let d = 1; d <= total; d++) days.push(d);

  const pick = (d) => {
    if (!start || (start && end)) { setStart(d); setEnd(null); }
    else if (d < start) setStart(d);
    else setEnd(d);
  };

  const inRange = (d) => start && end && d >= start && d <= end;
  const isEdge = (d) => d === start || d === end;

  return (
    <div className="page">
      <div className="sub-header">
        <button className="back" onClick={back}><I.ChevronBack /></button>
        <span className="title">Block Date</span>
      </div>
      <div className="app-scroll" style={{ padding: "0 16px calc(24px + env(safe-area-inset-bottom, 0px))" }}>
        <div className="card" style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: "var(--ink)", marginBottom: 12 }}>
            {today.toLocaleString(undefined, { month: "long", year: "numeric" })}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, fontSize: 12, fontWeight: 700, color: "var(--ink-4)", textAlign: "center", marginBottom: 6 }}>
            {["Mo","Tu","We","Th","Fr","Sa","Su"].map(d => <div key={d}>{d}</div>)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {days.map((d, i) => (
              <button key={i} disabled={!d}
                onClick={() => d && pick(d)}
                style={{
                  aspectRatio: "1 / 1",
                  border: 0,
                  background: d && isEdge(d) ? "var(--primary)" : d && inRange(d) ? "var(--primary-soft-bg)" : "transparent",
                  color: d && isEdge(d) ? "#fff" : d && inRange(d) ? "var(--primary-strong)" : "var(--ink)",
                  fontWeight: 700,
                  borderRadius: 999,
                  cursor: d ? "pointer" : "default",
                  fontSize: 15,
                }}>
                {d || ""}
              </button>
            ))}
          </div>
        </div>
        <div className="card" style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <div><div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-4)" }}>From</div><div style={{ fontSize: 18, fontWeight: 800 }}>{start ? `${String(start).padStart(2,"0")} ${today.toLocaleString(undefined,{month:"short"})}` : "—"}</div></div>
            <div><div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-4)" }}>To</div><div style={{ fontSize: 18, fontWeight: 800 }}>{end ? `${String(end).padStart(2,"0")} ${today.toLocaleString(undefined,{month:"short"})}` : "—"}</div></div>
          </div>
        </div>
        <button className="btn" disabled={!start || !end} onClick={() => { addToast("Date blocked"); back(); }} style={{ opacity: (!start || !end) ? 0.5 : 1 }}>Block selected dates</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
