// a populated view around "today" no matter which day it's opened.
// Builds the string from local date parts — NOT toISOString(), which
// converts to UTC first and silently shifts the date by a day in any
// timezone ahead of UTC (e.g. CEST).
function relDate(offsetDays) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + offsetDays);
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

/* global React, I */

const { useState, useRef, useEffect } = React;

const VALID_EMAIL    = "tamas@szurmik.com";
const VALID_PASSWORD = "password";
const VALID_OTP      = "444555";

const LANGS = [
  { code: "en", label: "EN" },
  { code: "hu", label: "HU" },
  { code: "de", label: "DE" },

function LoginScreen({ go, goHome }) {
  const [lang, setLang]       = useState("en");
  const [email, setEmail]     = useState("");
  const [password, setPassword] = useState("");
  const [error, setError]     = useState(false);
  const [loading, setLoading] = useState(false);
  const passwordRef           = useRef(null);

  const submit = (e) => {
    e.preventDefault();
    if (loading) return;
    if (!email && !password) { goHome(); return; }
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      if (email.trim() === VALID_EMAIL && password === VALID_PASSWORD) {
        go("mfa");
      } else {
        setError(true);
      }
    }, 600);
  };

  const retry = () => {
    setError(false);
    setPassword("");
    setTimeout(() => passwordRef.current?.focus(), 50);
  };

  return (
    <div className="login-page">
      <div className="login-header">
        <select className="lang-select" value={lang} onChange={e => setLang(e.target.value)}>
          {LANGS.map(l => (
            <option key={l.code} value={l.code}>{l.label}</option>
          ))}
        </select>
      </div>

      <div className="login-body">
        <div style={{ textAlign: "center", marginBottom: 40 }}>
          <div style={{ fontSize: 13, fontWeight: 800, letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--primary)", marginBottom: 8 }}>SabeeApp Go</div>
          <div style={{ fontSize: 28, fontWeight: 800, color: "var(--ink)", letterSpacing: "-0.02em", lineHeight: 1.15 }}>Welcome back</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: "var(--ink-4)", marginTop: 6 }}>Sign in to your account</div>
        </div>

        <form onSubmit={submit}>
          <div className="form-group">
            <input
              placeholder=" "
              type="email"
              value={email}
              onChange={e => setEmail(e.target.value)}
              autoComplete="email"
            />
            <label>Email</label>
          </div>

          <div className="form-group" style={{ marginBottom: 24 }}>
            <input
              ref={passwordRef}
              placeholder=" "
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              autoComplete="current-password"
            />
            <label>Password</label>
          </div>

          <button
            className="btn"
            type="submit"
            disabled={loading}
            style={{ opacity: 1 }}
          >
            {loading
              ? <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 18, height: 18, border: "2.5px solid rgba(255,255,255,0.4)", borderTopColor: "#fff", borderRadius: "50%", animation: "spin 0.8s linear infinite", display: "inline-block" }} />
                  Signing in…
                </span>
              : "Sign in"
            }
          </button>
        </form>
      </div>

      <div className="login-footer">
        Account management is handled through your SabeeApp PMS
      </div>

      {error && (
        <div className="sheet-backdrop" onClick={retry}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>Sign in failed</h3>
              <button className="icon-btn" onClick={retry}><I.X /></button>
            </div>
            <div style={{ marginTop: 16, marginBottom: 8 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: "var(--ink-3)", lineHeight: 1.5 }}>
                The email or password you entered is incorrect. Please check your credentials and try again.
              </div>
            </div>
            <div style={{ marginTop: 24 }}>
              <button className="btn" onClick={retry}>Try again</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MFAScreen({ goHome, back }) {
  const [digits, setDigits] = useState(["", "", "", "", "", ""]);
  const [error, setError]   = useState(false);
  const [loading, setLoading] = useState(false);
  const inputRefs = [useRef(), useRef(), useRef(), useRef(), useRef(), useRef()];

  useEffect(() => {
    const t = setTimeout(() => inputRefs[0].current?.focus(), 350);
    return () => clearTimeout(t);
  }, []);

  const verify = (d) => {
    const code = d.join("");
    setLoading(true);
    setTimeout(() => {
      if (code === VALID_OTP) {
        goHome();
      } else {
        setLoading(false);
        setError(true);
        setDigits(["", "", "", "", "", ""]);
        setTimeout(() => inputRefs[0].current?.focus(), 50);
      }
    }, 600);
  };

  const handleKey = (i, e) => {
    if (e.key === "Backspace") {
      e.preventDefault();
      const next = [...digits];
      if (next[i]) {
        next[i] = "";
        setDigits(next);
      } else if (i > 0) {
        next[i - 1] = "";
        setDigits(next);
        inputRefs[i - 1].current?.focus();
      }
      setError(false);
    }
  };

  const handleChange = (i, e) => {
    if (loading) return;
    const val = e.target.value.replace(/\D/g, "").slice(-1);
    const next = [...digits];
    next[i] = val;
    setDigits(next);
    setError(false);
    if (val && i < 5) {
      inputRefs[i + 1].current?.focus();
    } else if (val && i === 5) {
      verify(next);
    }
  };

  const handlePaste = (e) => {
    e.preventDefault();
    const pasted = e.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
    if (!pasted) return;
    const next = ["", "", "", "", "", ""];
    for (let i = 0; i < pasted.length; i++) next[i] = pasted[i];
    setDigits(next);
    setError(false);
    if (pasted.length === 6) {
      verify(next);
    } else {
      inputRefs[Math.min(pasted.length, 5)].current?.focus();
    }
  };

  return (
    <div className="page">
      <div className="sub-header">
        <button className="back" onClick={back}><I.ChevronBack /></button>
        <span className="title">Two-step verification</span>
      </div>

      <div style={{ padding: "48px var(--pad) 0", textAlign: "center" }}>
        <div style={{ width: 64, height: 64, borderRadius: "50%", background: "var(--primary-soft-bg)", border: "1.5px solid var(--primary-soft)", display: "inline-flex", alignItems: "center", justifyContent: "center", color: "var(--primary)", marginBottom: 20 }}>
          <I.IDCard style={{ width: 30, height: 30 }} />
        </div>
        <div style={{ fontSize: 15, fontWeight: 600, color: "var(--ink-3)", lineHeight: 1.5, marginBottom: 40 }}>
          Enter the 6-digit code from<br />your authenticator app
        </div>

        <div className="otp-row" style={{ marginBottom: 20 }}>
          {digits.map((d, i) => (
            <React.Fragment key={i}>
              {i === 3 && <span className="otp-sep">·</span>}
              <input
                ref={inputRefs[i]}
                className={"otp-digit" + (d ? " filled" : "") + (error ? " error" : "")}
                type="tel"
                inputMode="numeric"
                maxLength={1}
                value={d}
                disabled={loading}
                onChange={e => handleChange(i, e)}
                onKeyDown={e => handleKey(i, e)}
                onPaste={i === 0 ? handlePaste : undefined}
              />
            </React.Fragment>
          ))}
        </div>

        <div style={{ height: 28, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {loading && (
            <span style={{ width: 20, height: 20, border: "2.5px solid var(--line-strong)", borderTopColor: "var(--primary)", borderRadius: "50%", animation: "spin 0.8s linear infinite", display: "inline-block" }} />
          )}
          {error && !loading && (
            <span>
              <span style={{ fontSize: 14, fontWeight: 700, color: "var(--warn)" }}>Invalid code. </span>
              <button onClick={() => { setError(false); setTimeout(() => inputRefs[0].current?.focus(), 50); }}
                style={{ background: "none", border: "none", fontSize: 14, fontWeight: 700, color: "var(--primary)", cursor: "pointer", padding: 0 }}>
                Try again
              </button>
            </span>
          )}
        </div>
      </div>
    </div>
  );
}

window.LoginScreen = LoginScreen;
window.MFAScreen   = MFAScreen;

  </script>

  <script type="text/babel">
/* global React, I, Pill, RESERVATIONS, Segment, ReservationCard, CheckinSignScreen */

const { useState, useRef, useEffect } = React;

// Mock "history" timestamps for the Reservation Status sheet. Not wired to
// any specific reservation's real dates — this is an illustrative timeline
// shared by every reservation, so every offset is <= 0 (today or earlier)
// to avoid ever showing a future date for a step already marked done.
// Built from local date parts (day/month), not toISOString() — same reason
// as relDate()/calIso() elsewhere in this project: toISOString() converts
// to UTC first and can silently shift the displayed day back by one.
function historyStamp(offsetDays, hh, mm) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const month = d.toLocaleDateString("en-US", { month: "short" });
  return `${d.getDate()} ${month} ${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}

const STATUS_STEPS = [
  { key: "confirmed", label: "Reserved",  Icon: I.Calendar, ts: historyStamp(-6, 9, 12) },
  { key: "check-in",  label: "Check-in",  Icon: I.Refresh,  ts: historyStamp(-2, 15, 5) },
  { key: "onboard",   label: "Onboard",   Icon: I.ArrowIn,  ts: historyStamp(-2, 15, 7) },
  { key: "check-out", label: "Check-out", Icon: I.ArrowOut, ts: historyStamp(0, 11, 30) },
];

// Signing and VIZA reporting are onboarding actions, not "whatever the
// current status happens to be" actions — they're always attached directly
// below the Onboard row itself (see the sheet's render below), whether that
// row is still the upcoming/outlined step or already done. Report to VIZA
// only makes sense once onboarding has actually happened, so it only joins
// Sign once Onboard is reached.

function ArrivalsScreen({ go, back }) {
  const [tab, setTab] = useState("Today");
  const [collapsed, setCollapsed] = useState(false);
  const sentinelRef = useRef(null);
  const list = RESERVATIONS;

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => setCollapsed(!entry.isIntersecting),
      { threshold: 0 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <div className="page">
      <div className="sub-header">
        <button className="back" onClick={back}><I.ChevronBack /></button>
        <span className="title">{collapsed ? `${tab}'s Arrivals` : "Arrivals"}</span>
      </div>

      <div className="app-scroll" style={{ paddingBottom: "calc(24px + env(safe-area-inset-bottom, 0px))" }}>
        <Segment tabs={["Yesterday", "Today", "Tomorrow"]} value={tab} onChange={setTab} />

        <div className="stat-block">
          <div className="stat-card">
            <div className="label"><I.Users style={{ width: 16, height: 16 }} /> Guests</div>
            <div className="value">23 / 56</div>
          </div>
          <div className="stat-card">
            <div className="label"><I.Briefcase style={{ width: 16, height: 16 }} /> Reservations</div>
            <div className="value">6 / 17</div>
          </div>
        </div>

        <div className="section-title" ref={sentinelRef}>
          <h2>{tab}'s Arrivals</h2>
          <button className="icon-btn"><I.Filter /></button>
        </div>

        <div className="stagger">
          {list.map(r => (
            <ReservationCard key={r.id} r={r} onClick={() => go("reservation", r.id)} dimmed={tab !== "Today" && r.status === "open"} />
          ))}
        </div>
      </div>
    </div>
  );
}

function ReservationDetailScreen({ id, go, back, addToast }) {
  const r = RESERVATIONS.find(x => x.id === id) || RESERVATIONS[0];
  const [status, setStatus] = useState(r.status);
  const [menuOpen, setMenuOpen] = useState(false);
  const [statusSheetOpen, setStatusSheetOpen] = useState(false);
  const [statusUpdating, setStatusUpdating] = useState(false);
  const [checkoutConfirmOpen, setCheckoutConfirmOpen] = useState(false);
  const [vizaStatus, setVizaStatus] = useState("idle"); // idle | loading | done
  const [checkinOpen, setCheckinOpen] = useState(false);
  const [signed, setSigned] = useState(false);
  const [commentsSheetOpen, setCommentsSheetOpen] = useState(false);
  const [comments, setComments] = useState(window.COMMENTS[r.id] || []);
  const [commentDraft, setCommentDraft] = useState("");
  const commentsListRef = useRef(null);
  const guests = (window.GUESTS[r.id] || []);
  const statusIndex = Math.max(0, STATUS_STEPS.findIndex(s => s.key === status));

  const scrollCommentsToBottom = () => {
    const el = commentsListRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  };

  useEffect(() => {
    if (commentsSheetOpen) setTimeout(scrollCommentsToBottom, 0);
  }, [commentsSheetOpen]);

  const sendComment = () => {
    const text = commentDraft.trim();
    if (!text) return;
    setComments(prev => [...prev, { id: `local-${Date.now()}`, author: "You", role: "Front Desk", dateTime: "Just now", message: text }]);
    setCommentDraft("");
    setTimeout(scrollCommentsToBottom, 0);
  };

  const initials = (name) => name.split(" ").filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();

  const cycle = () => {
    const order = ["confirmed", "onboard", "check-in", "check-out"];
    const i = order.indexOf(status);
    const next = order[(i + 1) % order.length];
    setStatus(next);
    addToast(`Status → ${next === "check-in" ? "Check-in" : next === "check-out" ? "Check-out" : next === "onboard" ? "Onboard" : "Confirmed"}`);
  };

  const doAdvance = (next) => {
    setStatusUpdating(true);
    setTimeout(() => {
      setStatus(next.key);
      setStatusUpdating(false);
      addToast(`Status → ${next.label}`);
    }, 1400);
  };

  // Check-out only ever follows Onboard in STATUS_STEPS, so this is really
  // "guard the onboard → check-out transition" — going straight to check-out
  // right after onboarding is an unusual, high-consequence jump (most likely
  // a mis-tap), so it gets a confirmation instead of advancing immediately
  // like every other step does.
  const advanceStatus = () => {
    const next = STATUS_STEPS[statusIndex + 1];
    if (!next || statusUpdating) return;
    if (next.key === "check-out") {
      setCheckoutConfirmOpen(true);
      return;
    }
    doAdvance(next);
  };

  const confirmCheckout = () => {
    setCheckoutConfirmOpen(false);
    const next = STATUS_STEPS[statusIndex + 1];
    if (next) doAdvance(next);
  };

  const reportToViza = () => {
    if (vizaStatus !== "idle") return;
    setVizaStatus("loading");
    setTimeout(() => setVizaStatus("done"), 1200);
  };

  return (
    <div className="page">
      <div className="sub-header">
        <button className="back" onClick={back}><I.ChevronBack /></button>
        <span className="title">Reservation Details</span>
      </div>

      <div className="app-scroll" style={{ paddingBottom: "calc(80px + env(safe-area-inset-bottom, 0px))" }}>
        <div className="detail-block">
          <div className="header">
            <span style={{ color: "var(--primary)", fontSize: 22, fontWeight: 800, letterSpacing: "0.02em" }}>{r.id}</span>
            <button onClick={cycle} style={{ background: "transparent", border: 0, padding: 0, cursor: "pointer" }} title="Tap to advance status">
              <Pill status={status} />
            </button>
          </div>
          <div className="name">{r.name}</div>
          <div className="fact-grid">
            <div className="fact"><div className="l"><I.Calendar style={{ width: 14, height: 14 }} /> Check-in</div><div className="v">{r.checkIn}</div></div>
            <div className="fact"><div className="l"><I.Calendar style={{ width: 14, height: 14 }} /> Check-out</div><div className="v">{r.checkOut}</div></div>
            <div className="fact"><div className="l"><I.Users style={{ width: 14, height: 14 }} /> Guests</div><div className="v">{r.composition}</div></div>
            <div className="fact"><div className="l"><I.Briefcase style={{ width: 14, height: 14 }} /> Partner</div><div className="v">{r.partner}</div></div>
            <div className="fact" style={{ gridColumn: "1 / -1" }}><div className="l"><I.Door style={{ width: 14, height: 14 }} /> Room / Type</div><div className="v">{r.roomNo} ({r.room})</div></div>
          </div>
        </div>

        <div className="section-title">
          <h2>Guests</h2>
        </div>

        <div className="stagger">
          {guests.map(g => (
            <div key={g.id} className="guest-card tap-anim tappable" onClick={() => go("guest", { resId: r.id, guestId: g.id })}>
              <button className="scan-btn" onClick={(e) => { e.stopPropagation(); go("idscan"); }}>
                <I.IDCard />
              </button>
              <div className="id">ID: {g.id}{g.booker && <span className="booker">(Booker)</span>}</div>
              <div className="name">{g.name}</div>
              <div className="fact-grid" style={{ gap: "8px 16px" }}>
                <div><div style={{ fontSize: 13, color: "var(--ink-4)", fontWeight: 600 }}>Age</div><div style={{ fontSize: 17, fontWeight: 700 }}>{g.age}</div></div>
                <div><div style={{ fontSize: 13, color: "var(--ink-4)", fontWeight: 600 }}>Gender</div><div style={{ fontSize: 17, fontWeight: 700 }}>{g.gender}</div></div>
                <div><div style={{ fontSize: 13, color: "var(--ink-4)", fontWeight: 600 }}>Nationality</div><div style={{ fontSize: 17, fontWeight: 700 }}>{g.nationality}</div></div>
                <div><div style={{ fontSize: 13, color: "var(--ink-4)", fontWeight: 600 }}>Reporting</div><div style={{ fontSize: 17, fontWeight: 700 }}>{g.reporting}</div></div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <button className="fab" onClick={() => setMenuOpen(true)}><I.GridFill /></button>

      {menuOpen && (
        <div className="sheet-backdrop" onClick={() => setMenuOpen(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>{r.id}</h3>
              <button className="icon-btn" onClick={() => setMenuOpen(false)}><I.X /></button>
            </div>
            <div style={{ marginTop: 8 }}>
              <button className="action-item" onClick={() => { setMenuOpen(false); setStatusSheetOpen(true); }}>
                <span className="action-icon"><I.Bolt /></span>
                Change Status
              </button>
              <button className="action-item" onClick={() => { setMenuOpen(false); setCommentsSheetOpen(true); }}>
                <span className="action-icon"><I.Comment /></span>
                Comments
              </button>
            </div>
          </div>
        </div>
      )}

      {statusSheetOpen && (
        <div className="sheet-backdrop" onClick={() => setStatusSheetOpen(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>Reservation Status</h3>
              <button className="icon-btn" onClick={() => setStatusSheetOpen(false)}><I.X /></button>
            </div>
            <div style={{ marginTop: 20 }}>
              <div className="status-timeline">
                {(() => {
                  const doneSteps = STATUS_STEPS.slice(0, statusIndex + 1);
                  const nextStep = STATUS_STEPS[statusIndex + 1] || null;
                  const nextIsOnboard = !!nextStep && nextStep.key === "onboard";

                  const actionsRow = (buttons, isFinal) => (
                    <div className="status-step actions-row">
                      <div className="node-col">
                        {!isFinal && <div className="connector dashed" />}
                      </div>
                      <div className="body">
                        <div className="status-actions">
                          {buttons.includes("sign") && (
                            <button
                              className={"status-action-btn" + (signed ? " done" : "")}
                              onClick={() => setCheckinOpen(true)}
                              disabled={signed}
                            >
                              {signed ? <I.Check style={{ width: 16, height: 16 }} /> : <I.Edit style={{ width: 16, height: 16 }} />}
                              {signed ? "Signed" : "Sign"}
                            </button>
                          )}
                          {buttons.includes("report") && (
                            <button
                              className={"status-action-btn" + (vizaStatus === "done" ? " done" : "")}
                              onClick={reportToViza}
                              disabled={vizaStatus !== "idle"}
                            >
                              {vizaStatus === "loading" && <div className="status-spinner status-spinner-sm" />}
                              {vizaStatus === "done" && <I.Check style={{ width: 16, height: 16 }} />}
                              {vizaStatus === "idle" && "Report to VIZA"}
                              {vizaStatus === "loading" && "Reporting…"}
                              {vizaStatus === "done" && "Scheduled"}
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  );

                  return (
                    <>
                      {doneSteps.map((s, i) => {
                        const isCurrent = i === statusIndex;
                        const isLastDone = i === doneSteps.length - 1;
                        const onboardDoneHere = s.key === "onboard";
                        const dashedAfter = onboardDoneHere || (isLastDone && nextStep);
                        return (
                          <React.Fragment key={s.key}>
                            <div className={"status-step " + (isCurrent ? "current" : "done") + (onboardDoneHere ? " tight-bottom" : "")}>
                              <div className="node-col">
                                <div className="icon-circle"><s.Icon style={{ width: 18, height: 18 }} /></div>
                                {(!isLastDone || dashedAfter) && <div className={"connector" + (dashedAfter ? " dashed" : "")} />}
                              </div>
                              <div className="body">
                                <div className="label-line"><h4>{s.label}</h4></div>
                                <div className="ts">{s.ts}</div>
                              </div>
                            </div>
                            {/* Onboard already reached — its actions (both Sign and, now
                                that onboarding happened, Report to VIZA) attach right here,
                                regardless of whether Onboard is the current step or an
                                earlier one already passed. */}
                            {onboardDoneHere && actionsRow(["sign", "report"], false)}
                          </React.Fragment>
                        );
                      })}

                      {nextStep && (
                        <React.Fragment>
                          <div className={"status-step future next" + (nextIsOnboard ? " tight-bottom" : " last")}>
                            <div className="node-col">
                              <div
                                className={"icon-circle" + (statusUpdating ? " updating" : "")}
                                onClick={!statusUpdating ? advanceStatus : undefined}
                              >
                                {statusUpdating
                                  ? <div className="status-spinner" />
                                  : <nextStep.Icon style={{ width: 20, height: 20 }} />}
                              </div>
                            </div>
                            <div className="body">
                              <div className="label-line"><h4>{statusUpdating ? "Updating status…" : nextStep.label}</h4></div>
                            </div>
                          </div>
                          {/* Onboard hasn't happened yet — only Sign is available; Report
                              to VIZA isn't possible before onboarding. This is also always
                              the last visible row, since only the immediate next step is
                              ever shown. */}
                          {nextIsOnboard && actionsRow(["sign"], true)}
                        </React.Fragment>
                      )}
                    </>
                  );
                })()}
              </div>
            </div>
          </div>
        </div>
      )}

      {checkoutConfirmOpen && (
        <div className="sheet-backdrop" onClick={() => setCheckoutConfirmOpen(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>Check out guest?</h3>
              <button className="icon-btn" onClick={() => setCheckoutConfirmOpen(false)}><I.X /></button>
            </div>
            <div style={{ marginTop: 16, fontSize: "var(--font-base)", color: "var(--ink-2)", lineHeight: 1.5 }}>
              This guest was only just onboarded. Checking out immediately after onboarding is unusual — are you sure you want to continue?
            </div>
            <div className="actions">
              <button className="btn secondary" onClick={() => setCheckoutConfirmOpen(false)}>Cancel</button>
              <button className="btn" onClick={confirmCheckout}>Check out</button>
            </div>
          </div>
        </div>
      )}

      {commentsSheetOpen && (
        <div className="sheet-backdrop" onClick={() => setCommentsSheetOpen(false)}>
          <div className="sheet comments-sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>Comments</h3>
              <button className="icon-btn" onClick={() => setCommentsSheetOpen(false)}><I.X /></button>
            </div>

            <div className="comments-list" ref={commentsListRef}>
              {comments.length === 0 && (
                <div style={{ padding: "24px 0", textAlign: "center", color: "var(--ink-4)", fontSize: "var(--font-sm)", fontWeight: 600 }}>
                  No comments yet
                </div>
              )}
              {comments.map(c => (
                <div key={c.id} className={"comment-row" + (c.role === "Guest" ? " guest" : "")}>
                  <div className="comment-avatar">{initials(c.author)}</div>
                  <div className="comment-body">
                    <div className="comment-meta">
                      <span className="comment-author">{c.author} <span className="comment-role">· {c.role}</span></span>
                      <span className="comment-time">{c.dateTime}</span>
                    </div>
                    <div className="comment-message">{c.message}</div>
                  </div>
                </div>
              ))}
            </div>

            <div className="comments-compose">
              <textarea
                rows={1}
                placeholder="Write a comment…"
                value={commentDraft}
                onChange={e => setCommentDraft(e.target.value)}
              />
              <button className="comment-send" disabled={!commentDraft.trim()} onClick={sendComment}>
                <I.Send />
              </button>
            </div>
          </div>
        </div>
      )}

      {checkinOpen && (
        <CheckinSignScreen
          guestName={r.name}
          guestEmail={r.email}
          onClose={() => setCheckinOpen(false)}
          onConfirm={() => {
            setSigned(true);
            setCheckinOpen(false);
            addToast("T&C accepted — signature saved");
          }}
        />
      )}
    </div>
  );
}

window.ArrivalsScreen = ArrivalsScreen;
window.ReservationDetailScreen = ReservationDetailScreen;

  </script>

  <script type="text/babel">
/* global React, I, ROOMS, RESERVATIONS, BLOCKS, PROPERTIES */

const { useState, useRef, useLayoutEffect, useEffect, useMemo } = React;

const CAL_DAY_COL = 46;
const CAL_ROOM_COL = 64;
const CAL_HEADER_H = 34;
const CAL_GROUP_H = 28;
const CAL_ROW_H = 44;
const CAL_DAYS_BEFORE = 14;
const CAL_DAYS_AFTER = 45;
const CAL_TOTAL_DAYS = CAL_DAYS_BEFORE + CAL_DAYS_AFTER + 1;
const CAL_DOW = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
const CAL_TAP_SLOP = 6;

// Local date parts — NOT toISOString(), which converts to UTC first and
// silently shifts the date by a day in any timezone ahead of UTC.
function calIso(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}
function calAddDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function calParseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function calDayIndex(windowStart, iso) { return Math.round((calParseISO(iso) - windowStart) / 86400000); }
// Shared by both the tap-to-select flow and the confirm sheet's own date
// inputs, so editing the dates after the sheet is open is checked exactly
// the same way as the initial two-tap selection.
function calRangeConflict(roomId, startIso, endIso) {
  if (RESERVATIONS.some(r => r.roomId === roomId && startIso < r.endDate && r.startDate < endIso)) {
    return "Can't block — an existing reservation falls in that range";
  }
  if (BLOCKS.some(b => b.roomId === roomId && startIso < b.endDate && b.startDate < endIso)) {
    return "Can't block — part of that range is already blocked";
  }
  return null;
}
function calClamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function calFormat(iso) { return calParseISO(iso).toLocaleDateString(undefined, { day: "2-digit", month: "short" }); }

// Interleaves room-type header rows with room rows (skipping rooms whose
// type is collapsed), each carrying its cumulative vertical offset — this
// is the single source of truth for where every row sits in the grid.
function calBuildRows(rooms, collapsed) {
  const list = [];
  let y = 0;
  let lastType = null;
  for (const room of rooms) {
    if (room.type !== lastType) {
      list.push({ kind: "header", type: room.type, y, height: CAL_GROUP_H });
      y += CAL_GROUP_H;
      lastType = room.type;
    }
    if (!collapsed.has(room.type)) {
      list.push({ kind: "room", room, y, height: CAL_ROW_H });
      y += CAL_ROW_H;
    }
  }
  return list;
}
function calRowAt(rowList, y) {
  for (const row of rowList) if (y >= row.y && y < row.y + row.height) return row;
  return null;
}

function CalendarScreen({ go, property, setProperty, addToast }) {
  const [switchOpen, setSwitchOpen] = useState(false);
  const [roomPickerOpen, setRoomPickerOpen] = useState(false);
  const [collapsed, setCollapsed] = useState(() => new Set());
  const [size, setSize] = useState({ w: 0, h: 0 });
  const [panX, setPanX] = useState(0);
  const [panY, setPanY] = useState(0);
  const [animate, setAnimate] = useState(false);
  const [pending, setPending] = useState(null); // { roomId, roomName, iso }
  const [confirm, setConfirm] = useState(null); // { roomId, roomName, startIso, endIso }
  const [expandedRoom, setExpandedRoom] = useState(null); // roomId

  const wrapRef = useRef(null);
  const drag = useRef(null);
  const expandTimer = useRef(null);
  const anchored = useRef(false);

  const propName = property?.name || "Sunshine Hotel & Apartments";
  const rooms = ROOMS;

  const windowStart = useRef(calAddDays(new Date(new Date().setHours(0, 0, 0, 0)), -CAL_DAYS_BEFORE)).current;

  const dates = useMemo(() => {
    const arr = [];
    for (let i = 0; i < CAL_TOTAL_DAYS; i++) {
      const d = calAddDays(windowStart, i);
      arr.push({ iso: calIso(d), dow: CAL_DOW[d.getDay()], num: d.getDate(), isToday: i === CAL_DAYS_BEFORE });
    }
    return arr;
  }, []);

  const rowList = useMemo(() => calBuildRows(rooms, collapsed), [rooms, collapsed]);
  const roomRowY = {};
  for (const row of rowList) if (row.kind === "room") roomRowY[row.room.id] = row.y;
  const headers = rowList.filter(r => r.kind === "header");

  const gridWidth = CAL_TOTAL_DAYS * CAL_DAY_COL;
  const gridHeight = rowList.length ? rowList[rowList.length - 1].y + rowList[rowList.length - 1].height : 0;

  useEffect(() => () => { if (expandTimer.current) clearTimeout(expandTimer.current); }, []);

  useLayoutEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const measure = () => {
      const w = el.clientWidth, h = el.clientHeight;
      setSize({ w, h });
      if (!anchored.current && w > 0) {
        anchored.current = true;
        const initialMaxPanX = Math.max(0, gridWidth - Math.max(0, w - CAL_ROOM_COL));
        setPanX(calClamp(CAL_DAYS_BEFORE * CAL_DAY_COL, 0, initialMaxPanX));
      }
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const areaW = Math.max(0, size.w - CAL_ROOM_COL);
  const areaH = Math.max(0, size.h - CAL_HEADER_H);
  const maxPanX = Math.max(0, gridWidth - areaW);
  const maxPanY = Math.max(0, gridHeight - areaH);

  // Sticky-with-push header: pinned at the top of the content unless the
  // next section's header is close enough to shove it out of the way.
  let activeIdx = 0;
  for (let i = 0; i < headers.length; i++) { if (headers[i].y <= panY) activeIdx = i; else break; }
  const activeHeader = headers[activeIdx];
  const nextHeader = headers[activeIdx + 1];
  let pinnedOffset = 0;
  if (nextHeader) {
    const gap = (nextHeader.y - panY) - CAL_GROUP_H;
    if (gap < 0) pinnedOffset = gap;
  }

  const toggleCollapse = (type) => {
    setCollapsed(prev => {
      const next = new Set(prev);
      if (next.has(type)) next.delete(type); else next.add(type);
      return next;
    });
  };

  const goToday = () => {
    setAnimate(true);
    setPanX(calClamp(CAL_DAYS_BEFORE * CAL_DAY_COL, 0, maxPanX));
    setPanY(0);
    setTimeout(() => setAnimate(false), 340);
  };

  const startBlockFromPicker = (room) => {
    setRoomPickerOpen(false);
    let nextCollapsed = collapsed;
    if (collapsed.has(room.type)) {
      nextCollapsed = new Set(collapsed);
      nextCollapsed.delete(room.type);
      setCollapsed(nextCollapsed);
    }
    const rows = calBuildRows(rooms, nextCollapsed);
    const targetRow = rows.find(r => r.kind === "room" && r.room.id === room.id);
    const newGridHeight = rows.length ? rows[rows.length - 1].y + rows[rows.length - 1].height : 0;
    const newAreaH = Math.max(0, size.h - CAL_HEADER_H);
    const newMaxPanY = Math.max(0, newGridHeight - newAreaH);

    setPending({ roomId: room.id, roomName: room.name, iso: dates[CAL_DAYS_BEFORE].iso });
    setAnimate(true);
    setPanX(calClamp(CAL_DAYS_BEFORE * CAL_DAY_COL, 0, maxPanX));
    if (targetRow) {
      const centered = targetRow.y - newAreaH / 2 + CAL_ROW_H / 2;
      setPanY(calClamp(centered, 0, newMaxPanY));
    }
    setTimeout(() => setAnimate(false), 340);
    addToast(`Tap an end date for ${room.name}`);
  };

  const expandRoomLabel = (roomId) => {
    if (expandTimer.current) clearTimeout(expandTimer.current);
    setExpandedRoom(roomId);
    expandTimer.current = setTimeout(() => setExpandedRoom(null), 2500);
  };

  const handleTap = (localX, localY, panXAtDown, panYAtDown) => {
    if (expandedRoom) {
      if (expandTimer.current) clearTimeout(expandTimer.current);
      setExpandedRoom(null);
    }

    // The pinned sticky header spans the full width — it always wins.
    if (localY >= CAL_HEADER_H && localY < CAL_HEADER_H + CAL_GROUP_H) {
      if (activeHeader) toggleCollapse(activeHeader.type);
      return;
    }
    if (localY < CAL_HEADER_H) return;

    const gy = localY - CAL_HEADER_H + panYAtDown;
    const row = calRowAt(rowList, gy);
    if (!row) return;

    if (row.kind === "header") { toggleCollapse(row.type); return; }

    const room = row.room;
    if (localX < CAL_ROOM_COL) { expandRoomLabel(room.id); return; }

    const gx = localX - CAL_ROOM_COL + panXAtDown;
    const dateIdx = Math.floor(gx / CAL_DAY_COL);
    const date = dates[dateIdx];
    if (!date) return;

    const res = RESERVATIONS.find(r => r.roomId === room.id && date.iso >= r.startDate && date.iso < r.endDate);
    if (res) { go("reservation", res.id); return; }

    const blk = BLOCKS.find(b => b.roomId === room.id && date.iso >= b.startDate && date.iso < b.endDate);
    if (blk) { addToast("This date is blocked"); return; }

    if (!pending || pending.roomId !== room.id) {
      setPending({ roomId: room.id, roomName: room.name, iso: date.iso });
      return;
    }

    // Both tapped dates are included in the block — tapping the 7th then
    // the 10th blocks the 7th, 8th, 9th and 10th (checkout the 11th).
    const startIso = pending.iso < date.iso ? pending.iso : date.iso;
    const lastIso = pending.iso < date.iso ? date.iso : pending.iso;
    const endIso = calIso(calAddDays(calParseISO(lastIso), 1));

    // Check the whole range, not just the two tapped endpoints — a
    // reservation or existing block can sit entirely between them.
    const conflict = calRangeConflict(room.id, startIso, endIso);
    if (conflict) {
      addToast(conflict);
      setPending(null);
      return;
    }

    setConfirm({ roomId: room.id, roomName: room.name, startIso, endIso, comment: "" });
    setPending(null);
  };

  const onPointerDown = (e) => {
    setAnimate(false);
    const rect = wrapRef.current.getBoundingClientRect();
    drag.current = {
      x0: e.clientX, y0: e.clientY,
      panX0: panX, panY0: panY,
      moved: false,
      localX: e.clientX - rect.left,
      localY: e.clientY - rect.top,
    };
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    const d = drag.current;
    if (!d) return;
    const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.moved && Math.hypot(dx, dy) > CAL_TAP_SLOP) d.moved = true;
    if (d.moved) {
      setPanX(calClamp(d.panX0 - dx, 0, maxPanX));
      setPanY(calClamp(d.panY0 - dy, 0, maxPanY));
    }
  };
  const onPointerUp = () => {
    const d = drag.current;
    drag.current = null;
    if (!d || d.moved) return;
    handleTap(d.localX, d.localY, d.panX0, d.panY0);
  };

  const todayIdx = CAL_DAYS_BEFORE;
  const leftDate = dates[calClamp(Math.round(panX / CAL_DAY_COL), 0, dates.length - 1)];
  const cornerLabel = leftDate ? calParseISO(leftDate.iso).toLocaleDateString(undefined, { month: "short" }) : "";

  // Bars run from the midpoint of the check-in day's column to the midpoint
  // of the checkout day's column (arrival/departure happen midday), matching
  // the desktop PMS calendar's convention — not the day-column edges.
  const bars = RESERVATIONS.map(r => {
    const y = roomRowY[r.roomId];
    if (y === undefined) return null;
    const startIdx = calClamp(calDayIndex(windowStart, r.startDate), 0, CAL_TOTAL_DAYS);
    const endIdx = calClamp(calDayIndex(windowStart, r.endDate), 0, CAL_TOTAL_DAYS);
    if (endIdx <= startIdx) return null;
    return (
      <div key={r.id} className="cal-bar" data-status={r.status}
        style={{ left: startIdx * CAL_DAY_COL + CAL_DAY_COL / 2, top: y + 4, width: (endIdx - startIdx) * CAL_DAY_COL, height: CAL_ROW_H - 8 }}>
        {r.name}
      </div>
    );
  });

  const blockBars = BLOCKS.map(b => {
    const y = roomRowY[b.roomId];
    if (y === undefined) return null;
    const startIdx = calClamp(calDayIndex(windowStart, b.startDate), 0, CAL_TOTAL_DAYS);
    const endIdx = calClamp(calDayIndex(windowStart, b.endDate), 0, CAL_TOTAL_DAYS);
    if (endIdx <= startIdx) return null;
    return (
      <div key={b.id} className="cal-bar cal-bar-blocked"
        style={{ left: startIdx * CAL_DAY_COL + CAL_DAY_COL / 2, top: y + 4, width: (endIdx - startIdx) * CAL_DAY_COL, height: CAL_ROW_H - 8 }}>
        Blocked
      </div>
    );
  });

  let pendingMark = null;
  if (pending) {
    const y = roomRowY[pending.roomId];
    const idx = calDayIndex(windowStart, pending.iso);
    if (y !== undefined && idx >= 0 && idx < CAL_TOTAL_DAYS) {
      pendingMark = <div className="cal-pending" style={{ left: idx * CAL_DAY_COL + 2, top: y + 2, width: CAL_DAY_COL - 4, height: CAL_ROW_H - 4 }} />;
    }
  } else if (confirm) {
    // Highlights exactly the nights that will be blocked (startDate up to,
    // but not including, the checkout date) — stays on screen behind the
    // confirm sheet so the selected range is still visible, not just named.
    const y = roomRowY[confirm.roomId];
    const startIdx = calClamp(calDayIndex(windowStart, confirm.startIso), 0, CAL_TOTAL_DAYS);
    const endIdx = calClamp(calDayIndex(windowStart, confirm.endIso), 0, CAL_TOTAL_DAYS);
    if (y !== undefined && endIdx > startIdx) {
      pendingMark = <div className="cal-pending" style={{ left: startIdx * CAL_DAY_COL + 2, top: y + 2, width: (endIdx - startIdx) * CAL_DAY_COL - 4, height: CAL_ROW_H - 4 }} />;
    }
  }

  let expandedLabel = null;
  if (expandedRoom) {
    const y = roomRowY[expandedRoom];
    const room = rooms.find(r => r.id === expandedRoom);
    if (y !== undefined && room) {
      expandedLabel = (
        <div className="cal-room-expanded" style={{ top: CAL_HEADER_H + y - panY, height: CAL_ROW_H }}>
          <span>{room.name}</span>
          {room.housekeeping && <span className="cal-room-dot" data-hk={room.housekeeping} />}
        </div>
      );
    }
  }

  return (
    <div className="page">
      <div className="page-header" style={{ paddingTop: 16 }}>
        <button className="title-row" onClick={() => setSwitchOpen(true)}
          style={{ background: "none", border: 0, padding: 0, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, flex: 1, minWidth: 0, textAlign: "left" }}>
          <h1 style={{ margin: 0, fontSize: 22, fontWeight: 800, letterSpacing: "-0.02em", color: "var(--ink)", lineHeight: 1.2, flex: 1, minWidth: 0 }}>{propName}</h1>
          <I.ChevronDown style={{ color: "var(--primary)", width: 22, height: 22, flexShrink: 0 }} />
        </button>
        <div className="actions">
          <button className="icon-btn" onClick={goToday} aria-label="Jump to today" style={{ width: 36, height: 36 }}><I.Today day={dates[todayIdx].num} style={{ width: 36, height: 36 }} /></button>
          <button className="cal-add-btn" onClick={() => setRoomPickerOpen(true)} aria-label="Block a date"><I.Plus style={{ width: 14, height: 14 }} /></button>
        </div>
      </div>

      {roomPickerOpen && (
        <div className="sheet-backdrop" onClick={() => setRoomPickerOpen(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>Block a Date</h3>
              <button className="icon-btn" onClick={() => setRoomPickerOpen(false)}><I.X /></button>
            </div>
            <div style={{ marginTop: 8, fontSize: 13, fontWeight: 700, color: "var(--ink-4)", padding: "8px 4px 4px" }}>Select a room</div>
            <div>
              {rooms.map(r => (
                <button key={r.id} className="action-item" onClick={() => startBlockFromPicker(r)}>
                  <span className="action-icon"><I.Door /></span>
                  <span style={{ flex: 1, textAlign: "left" }}>
                    <div>{r.name}</div>
                    <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-4)", marginTop: 2 }}>{r.type}</div>
                  </span>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {switchOpen && (
        <div className="sheet-backdrop" onClick={() => setSwitchOpen(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>Switch Property</h3>
              <button className="icon-btn" onClick={() => setSwitchOpen(false)}><I.X /></button>
            </div>
            <div style={{ marginTop: 8 }}>
              {PROPERTIES.map(p => (
                <button key={p.id} className="action-item" onClick={() => { setProperty(p); setSwitchOpen(false); }}>
                  <span className="action-icon"><I.Home /></span>
                  <span style={{ flex: 1, textAlign: "left" }}>
                    <div>{p.name}</div>
                    <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-4)", marginTop: 2 }}>{p.type}</div>
                  </span>
                  {property?.id === p.id && <span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--primary)", flexShrink: 0 }} />}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      <div className="cal-wrap" ref={wrapRef}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp}>

        <div className="cal-corner" style={{ width: CAL_ROOM_COL, height: CAL_HEADER_H }}>
          <span className="dow">&nbsp;</span>
          <span className="num">{cornerLabel}</span>
        </div>

        <div className="cal-dates" style={{ left: CAL_ROOM_COL, height: CAL_HEADER_H }}>
          <div className={"cal-dates-inner" + (animate ? " cal-animated" : "")} style={{ width: gridWidth, transform: `translateX(${-panX}px)` }}>
            {dates.map((d, i) => (
              <div key={d.iso} className={"cal-date-cell" + (d.isToday ? " today" : "")} style={{ left: i * CAL_DAY_COL, width: CAL_DAY_COL }}>
                <span className="dow">{d.dow}</span>
                <span className="num">{d.num}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="cal-rooms" style={{ top: CAL_HEADER_H, width: CAL_ROOM_COL }}>
          <div className={"cal-rooms-inner" + (animate ? " cal-animated" : "")} style={{ height: gridHeight, transform: `translateY(${-panY}px)` }}>
            {rowList.filter(r => r.kind === "room").map(row => (
              <div key={row.room.id} className="cal-room-cell" style={{ top: row.y, height: row.height }}>
                <span className="cal-room-name">{row.room.name}</span>
                {row.room.housekeeping && <span className="cal-room-dot" data-hk={row.room.housekeeping} />}
              </div>
            ))}
          </div>
        </div>

        <div className="cal-body" style={{ top: CAL_HEADER_H, left: CAL_ROOM_COL }}>
          <div className={"cal-body-inner" + (animate ? " cal-animated" : "")}
            style={{ width: gridWidth, height: gridHeight, transform: `translate(${-panX}px, ${-panY}px)`, backgroundSize: `${CAL_DAY_COL}px 100%` }}>
            <div className="cal-today-col" style={{ left: todayIdx * CAL_DAY_COL, width: CAL_DAY_COL, height: gridHeight }} />
            {rowList.filter(r => r.kind === "room").map(row => (
              <div key={"rb-" + row.room.id} className="cal-room-band" style={{ top: row.y, height: row.height, width: gridWidth }} />
            ))}
            {blockBars}
            {bars}
            {pendingMark}
          </div>
        </div>

        {/* Full-width, edge-to-edge — spans past the frozen room column's
            border, unlike the old split room-column/grid pair it replaces. */}
        {headers.map(row => (
          <div key={"h-" + row.type} className="cal-type-row"
            style={{ top: CAL_HEADER_H + row.y - panY, height: row.height, transition: animate ? "top 0.34s cubic-bezier(0.32, 0.72, 0, 1)" : "none" }}>
            <I.ChevronRight className={"cal-type-chevron" + (collapsed.has(row.type) ? "" : " open")} />
            <span>{row.type}</span>
          </div>
        ))}

        {activeHeader && (
          <div className="cal-sticky-header" style={{ top: CAL_HEADER_H + pinnedOffset, height: CAL_GROUP_H }}>
            <I.ChevronRight className={"cal-type-chevron" + (collapsed.has(activeHeader.type) ? "" : " open")} />
            <span>{activeHeader.type}</span>
          </div>
        )}

        {expandedLabel}
      </div>

      {confirm && (
        <div className="sheet-backdrop" onClick={() => setConfirm(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="head">
              <h3>Block Date</h3>
              <button className="icon-btn" onClick={() => setConfirm(null)}><I.X /></button>
            </div>
            <div style={{ marginTop: 16 }}>
              <div className="field" style={{ marginBottom: 14 }}>
                <div className="l">Room</div>
                <div className="v">{confirm.roomName}</div>
              </div>
              <div className="grid-2">
                <div className="field">
                  <div className="l">From</div>
                  <input type="date" className="v-input" value={confirm.startIso}
                    max={calIso(calAddDays(calParseISO(confirm.endIso), -1))}
                    onChange={e => e.target.value && setConfirm(c => ({ ...c, startIso: e.target.value }))} />
                </div>
                <div className="field">
                  <div className="l">To (last night)</div>
                  <input type="date" className="v-input" value={calIso(calAddDays(calParseISO(confirm.endIso), -1))}
                    min={confirm.startIso}
                    onChange={e => e.target.value && setConfirm(c => ({ ...c, endIso: calIso(calAddDays(calParseISO(e.target.value), 1)) }))} />
                </div>
              </div>
              <div style={{ marginTop: 10, fontSize: 13, fontWeight: 700, color: "var(--ink-4)" }}>
                {calDayIndex(calParseISO(confirm.startIso), confirm.endIso)} night{calDayIndex(calParseISO(confirm.startIso), confirm.endIso) === 1 ? "" : "s"} blocked · checkout {calFormat(confirm.endIso)}
              </div>
              <div className="comment-field">
                <label>Comment</label>
                <textarea rows={2} placeholder="Add a note for this block…" value={confirm.comment}
                  onChange={e => setConfirm(c => ({ ...c, comment: e.target.value }))} />
              </div>
            </div>
            <button className="btn" style={{ marginTop: 20 }} onClick={() => {
              const conflict = calRangeConflict(confirm.roomId, confirm.startIso, confirm.endIso);
              if (conflict) { addToast(conflict); return; }
              addToast("Date blocked"); setConfirm(null);
            }}>Block selected dates</button>
          </div>
        </div>
      )}
    </div>
  );
}

window.CalendarScreen = CalendarScreen;

  </script>

/* global React, I, Segment, BRIEFING_ITEMS */

const { useState } = React;

function TasksScreen({ go, tasks, toggleTask }) {
  const [scope, setScope] = useState("Your");
  const filtered = tasks.filter(t => t.assignee === (scope === "Your" ? "you" : "team"));

  return (
    <div className="page">
      <div className="page-header" style={{ paddingTop: 16 }}>
        <h1 style={{ fontSize: 22 }}>Tasks</h1>
      </div>

      <div className="app-scroll" style={{ paddingTop: 4, paddingBottom: "calc(94px + env(safe-area-inset-bottom, 0px))" }}>
        <div className="card tap-anim tappable" onClick={() => go("briefing")}
          style={{ margin: "0 var(--pad) 20px", display: "flex", alignItems: "center", gap: 14 }}>
          <span className="action-icon"><I.Bell /></span>
          <span style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: "var(--ink)" }}>Good morning, Tamas</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: "var(--ink-3)", marginTop: 2 }}>{BRIEFING_ITEMS.length} things need attention</div>
          </span>
          <span style={{ display: "flex", alignItems: "center", gap: 2, color: "var(--primary)", fontWeight: 800, fontSize: 13, flexShrink: 0 }}>
            Open briefing <I.ChevronRight style={{ width: 14, height: 14 }} />
          </span>
        </div>

        <div className="section-title"><h2>Tasks</h2></div>

        <Segment tabs={["Your", "Team"]} value={scope} onChange={setScope} />

        <div className="stagger" style={{ marginTop: 16 }}>
          {filtered.length === 0 && <div className="empty">No {scope.toLowerCase()} tasks</div>}
          {filtered.map(t => (
            <div key={t.id} className="task-item tap-anim" onClick={() => toggleTask(t.id)}>
              <span className={"task-check" + (t.done ? " done" : "")}>{t.done && <I.Check style={{ width: 12, height: 12 }} />}</span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <div className={"task-title" + (t.done ? " done" : "")}>{t.title}</div>
                {t.who && <div className="task-who">{t.who}</div>}
              </span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function BriefingScreen({ back, tasks, addTask, addToast }) {
  return (
    <div className="page">
      <div className="sub-header">
        <button className="back" onClick={back}><I.ChevronBack /></button>
        <span className="title">Today's Briefing</span>
      </div>
      <div className="app-scroll" style={{ paddingBottom: "calc(24px + env(safe-area-inset-bottom, 0px))" }}>
        <div className="stagger" style={{ padding: "8px var(--pad) 0" }}>
          {BRIEFING_ITEMS.map(item => {
            const Icon = I[item.icon];
            const added = tasks.some(t => t.fromBriefingId === item.id);
            return (
              <div key={item.id} className="card" style={{ marginBottom: 12, display: "flex", gap: 14, alignItems: "flex-start" }}>
                <span className="action-icon"><Icon /></span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 16, fontWeight: 800, color: "var(--ink)", lineHeight: 1.3 }}>{item.title}</div>
                  <div style={{ fontSize: 14, fontWeight: 600, color: "var(--ink-3)", marginTop: 4, lineHeight: 1.4 }}>{item.detail}</div>
                  <button className={added ? "btn secondary" : "btn"} disabled={added}
                    style={{ marginTop: 12, height: 38, fontSize: 14, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6 }}
                    onClick={() => { addTask({ id: `t-${Date.now()}`, title: item.title, assignee: "you", done: false, fromBriefingId: item.id }); addToast("Added to your tasks"); }}>
                    {added ? (<><I.Check style={{ width: 14, height: 14 }} /> Added</>) : "Add as task"}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

window.TasksScreen = TasksScreen;
window.BriefingScreen = BriefingScreen;

function GuestDetailScreen({ resId, guestId, back, go }) {
  const list = GUESTS[resId] || [];
  const g = list.find(x => x.id === guestId) || list[0];
  const [menuOpen, setMenuOpen] = React.useState(false);
  if (!g) return null;
  return (
    <div className="page">

        <span className="title">Guest details</span>
      </div>

      <div className="app-scroll" style={{ paddingBottom: "calc(80px + env(safe-area-inset-bottom, 0px))" }}>
        <div style={{ padding: "0 16px" }} className="stagger">
          <div className="card" style={{ marginBottom: 16 }}>
            <Row label={`ID: ${g.id}`} value={g.name} divider />

  <script type="text/babel">
/* global React, I, SignaturePad, HOTEL_TERMS, PROPERTIES */

const { useState, useRef, useEffect } = React;

// The capture canvas is full-screen, but a signature only ever fills a small
// part of it — saving the whole canvas as-is gives a tall, mostly-empty PNG
// that then renders tiny once its full-screen aspect ratio gets squeezed
// into the check-in page's short, wide signature field. Crop to the actual
// ink's bounding box (from signature_pad's own point data, padded a bit for
// stroke width/antialiasing) so the saved image is just the signature.
function cropSignature(canvas, strokeData) {
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  const margin = 24; // CSS px
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  strokeData.forEach(group => group.points.forEach(pt => {
    if (pt.x < minX) minX = pt.x;
    if (pt.y < minY) minY = pt.y;
    if (pt.x > maxX) maxX = pt.x;
    if (pt.y > maxY) maxY = pt.y;
  }));
  minX = Math.max(0, minX - margin);
  minY = Math.max(0, minY - margin);
  maxX = Math.min(canvas.width / ratio, maxX + margin);
  maxY = Math.min(canvas.height / ratio, maxY + margin);

  const sx = minX * ratio, sy = minY * ratio;
  const sw = Math.max(1, (maxX - minX) * ratio), sh = Math.max(1, (maxY - minY) * ratio);
  const out = document.createElement("canvas");
  out.width = sw;
  out.height = sh;
  out.getContext("2d").drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
  return out.toDataURL("image/png");
}

// Check-in & Accepting T&C — a full-screen take-over (not a bottom sheet)
// pushed from the Reservation Status sheet's "Sign" action. Modeled on a
// paper hotel registration card: guest/property/date header, the full T&C
// text, then a signature field at the bottom. Rendered as an overlay from
// within ReservationDetailScreen rather than through app.js's screen stack,
// so its state (the in-progress signature) survives opening/closing the
// nested capture view without being reset by the stack's unmount-on-back
// behavior (see CLAUDE.md's CalendarScreen "Known Issues" for the same
// single-active-screen caveat elsewhere in this app).
function CheckinSignScreen({ guestName, guestEmail, onClose, onConfirm }) {
  const [signature, setSignature] = useState(null);
  const [captureOpen, setCaptureOpen] = useState(false);
  const today = new Date().toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
  const property = PROPERTIES[0];

  return (
    <div className="checkin-sign-backdrop">
      <div className="page">
        <div className="sub-header">
          <button className="back" onClick={onClose}><I.ChevronBack /></button>
          <span className="title">Check-in &amp; Accepting T&amp;C</span>
        </div>

        <div className="app-scroll" style={{ padding: "0 16px calc(24px + env(safe-area-inset-bottom, 0px))" }}>
          <div className="card" style={{ marginTop: 16, marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-4)" }}>Guest</div>
            <div style={{ fontSize: 19, fontWeight: 800, color: "var(--ink)", marginTop: 2 }}>{guestName}</div>
            <div style={{ display: "flex", gap: 24, marginTop: 12 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-4)" }}>Property</div>
                <div style={{ fontSize: 15, fontWeight: 700, color: "var(--ink)", marginTop: 2 }}>{property.name}</div>
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink-4)" }}>Date</div>
                <div style={{ fontSize: 15, fontWeight: 700, color: "var(--ink)", marginTop: 2 }}>{today}</div>
              </div>
            </div>
          </div>

          <h3 className="group-title" style={{ marginTop: 8 }}>Terms &amp; Conditions</h3>
          <div className="card checkin-terms" style={{ marginBottom: 16 }}>{HOTEL_TERMS}</div>

          <div className="checkin-consent-note">
            By signing below, <strong>{guestName}</strong> confirms they have read and accept the Terms &amp; Conditions and house policies above. A copy will be emailed to {guestEmail}.
          </div>

          <h3 className="group-title">Signature</h3>
          {!signature ? (
            <button className="sig-field" onClick={() => setCaptureOpen(true)}>
              <I.Edit style={{ width: 22, height: 22 }} />
              Tap to sign
            </button>
          ) : (
            <button className="sig-field filled" onClick={() => setCaptureOpen(true)}>
              <img src={signature.dataUrl} alt="Guest signature" />
            </button>
          )}
        </div>

        <div style={{ padding: "12px 16px calc(16px + env(safe-area-inset-bottom, 0px))", background: "var(--bg)", borderTop: "1px solid var(--line)", flexShrink: 0 }}>
          <button className="btn" disabled={!signature} style={{ opacity: signature ? 1 : 0.5 }} onClick={() => onConfirm(signature.dataUrl)}>
            Confirm &amp; Save
          </button>
        </div>
      </div>

      {captureOpen && (
        <SignatureCaptureScreen
          initialData={signature ? signature.raw : null}
          onCancel={() => setCaptureOpen(false)}
          onDone={(sig) => { setSignature(sig); setCaptureOpen(false); }}
        />
      )}
    </div>
  );
}

// Full-screen signature_pad canvas. Always full-screen regardless of the
// check-in page's own length or the device's orientation — this is what
// gives the signature the most room in either portrait or landscape without
// a separate "expand" step: rotating the phone while this is open just gives
// a wider canvas for free via the resize handler below.
//
// `initialData` (when re-opening to redo an existing signature) is the raw
// signature_pad point data, not the cropped display image — loading the
// cropped image back in would mean stretching a small, tightly-cropped PNG
// across the full-screen canvas via fromDataURL's width/height scaling,
// which distorts it. Point data reloads via fromData() at 1:1 scale instead.
function SignatureCaptureScreen({ initialData, onCancel, onDone }) {
  const canvasRef = useRef(null);
  const padRef = useRef(null);
  const [isEmpty, setIsEmpty] = useState(!initialData);

  useEffect(() => {
    const canvas = canvasRef.current;
    const wrap = canvas.parentElement;
    const pad = new SignaturePad(canvas, { penColor: "#142333", backgroundColor: "rgba(0,0,0,0)" });
    padRef.current = pad;
    pad.addEventListener("beginStroke", () => setIsEmpty(false));

    // Resizing a <canvas> element clears it, so on every resize (including a
    // device rotation) we snapshot whatever's currently drawn as vector point
    // data — not a bitmap — and redraw it after resizing, instead of just
    // wiping the signature the moment the phone turns.
    const resize = () => {
      const savedData = !pad.isEmpty() ? pad.toData() : null;
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      const { width, height } = wrap.getBoundingClientRect();
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      if (savedData) pad.fromData(savedData);
    };
    resize();
    if (initialData) pad.fromData(initialData);

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);
    return () => {
      window.removeEventListener("resize", resize);
      window.removeEventListener("orientationchange", resize);
      pad.off();
    };
  }, []);

  const clear = () => { padRef.current.clear(); setIsEmpty(true); };
  const done = () => {
    if (padRef.current.isEmpty()) return;
    const raw = padRef.current.toData();
    onDone({ dataUrl: cropSignature(canvasRef.current, raw), raw });
  };

  return (
    <div className="sig-capture-backdrop">
      <div className="page">
        <div className="sig-capture-bar">
          <button className="icon-btn" onClick={onCancel}><I.X /></button>
          <span className="sig-capture-title">Sign here</span>
          <button className="sig-clear-btn" onClick={clear} disabled={isEmpty}>Clear</button>
        </div>
        <div className="sig-canvas-wrap">
          <canvas ref={canvasRef} />
          <div className="sig-baseline" />
        </div>
        <div className="sig-capture-footer">
          <button className="btn" disabled={isEmpty} style={{ opacity: isEmpty ? 0.5 : 1 }} onClick={done}>Done</button>
        </div>
      </div>
    </div>
  );
}

window.CheckinSignScreen = CheckinSignScreen;

  </script>
