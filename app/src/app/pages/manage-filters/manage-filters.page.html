<ion-content>
  <div class="page">

    <div class="sub-header">
      <button class="back" (click)="back()" [attr.aria-label]="'manageFilters.ariaBack' | tr">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <span class="title">{{ 'manageFilters.title' | tr }}</span>
      <span class="right">
        <button (click)="openNew()"
          style="background: none; border: 0; cursor: pointer; padding: 0 4px; font: inherit; font-size: var(--font-md); font-weight: 800; color: var(--primary)">
          + {{ 'manageFilters.newFilter' | tr }}
        </button>
      </span>
    </div>

    <div class="app-scroll" style="padding-top: 8px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px))">
      <div cdkDropList (cdkDropListDropped)="drop($event)">
        @for (f of filterSvc.filters(auth.userId()); track f.id) {
          <div class="filter-row" cdkDrag>
            <span class="filter-row__handle" cdkDragHandle [attr.aria-label]="'manageFilters.ariaDrag' | tr">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
                <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
                <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
              </svg>
            </span>
            <button type="button" class="filter-row__body" (click)="openEdit(f)">
              <div class="filter-row__name">{{ f.name }}</div>
              <div class="filter-row__summary">{{ 'manageFilters.summaryPrefix' | tr }} {{ summaryKey(f) | tr }}</div>
            </button>
            <button class="icon-btn" (click)="openEdit(f)" [attr.aria-label]="'manageFilters.ariaEdit' | tr">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="icon-btn" [disabled]="!canDelete()" (click)="requestDelete(f)"
              [attr.aria-label]="(canDelete() ? 'manageFilters.ariaDelete' : 'manageFilters.ariaDeleteDisabled') | tr">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>
              </svg>
            </button>
          </div>
        }
      </div>
    </div>

  </div>
</ion-content>

<!-- Delete confirmation — same sheet shell as ReservationDetail's checkout/revert guards -->
@if (pendingDelete(); as filter) {
  <div class="sheet-backdrop" (click)="cancelDelete()">
    <div class="sheet" (click)="$event.stopPropagation()">
      <div class="head">
        <h3>{{ 'manageFilters.deleteConfirmTitle' | tr }}</h3>
        <button class="icon-btn" (click)="cancelDelete()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div style="margin-top: 16px; font-size: var(--font-base); color: var(--ink-2); line-height: 1.5">
        {{ 'manageFilters.deleteConfirmMessage' | tr:{name: filter.name} }}
      </div>
      <div class="actions">
        <button class="btn secondary" (click)="cancelDelete()">{{ 'common.cancel' | tr }}</button>
        <button class="btn danger" (click)="confirmDelete()">{{ 'manageFilters.deleteConfirmButton' | tr }}</button>
      </div>
    </div>
  </div>
}

<app-filter-editor-sheet #editor />
