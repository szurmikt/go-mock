<ion-content>
  <div class="page" style="background: var(--bg)">

    <div class="sub-header">
      <button class="back" (click)="back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <span class="title">Settings</span>
    </div>

    <div class="app-scroll" style="padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px))">
      <div style="padding: 24px var(--pad) 0; display: flex; flex-direction: column; gap: 16px">

        <!-- Profile -->
        <div style="text-align: center">
          <div style="font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em">
            {{ auth.name() || auth.email() }}
          </div>
          @if (auth.name()) {
            <div style="font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 4px">
              {{ auth.email() }}
            </div>
          }
        </div>

        <!-- Separator -->
        <div style="border-top: 1.5px solid var(--line-strong); margin: 16px 0"></div>

        <!-- Lock -->
        <button class="btn secondary" (click)="lock()">Lock screen</button>

        <!-- Logout -->
        <button class="btn danger" (click)="logout()" [disabled]="loggingOut()">
          @if (loggingOut()) {
            <span class="spin" style="width: 18px; height: 18px; border-width: 2.5px; border-top-color: var(--warn)"></span>
          } @else {
            Log out
          }
        </button>

      </div>
    </div>

  </div>
</ion-content>
