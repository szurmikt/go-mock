<ion-content>
  <div class="login-page">

    <div class="login-header">
      <select class="lang-select"
              [value]="lang.currentLanguage()"
              (change)="changeLang($event)">
        @for (l of lang.displayLanguages(); track l.code) {
          <option [value]="l.code">{{ l.code.toUpperCase() }}</option>
        }
      </select>
    </div>

    <div class="login-body">
      <div style="text-align:center; margin-bottom:56px">
        <img src="assets/logo-horizontal-white.png" alt="SabeeApp Go" style="width:min(70%, 300px); height:auto; display:block; margin:0 auto">
      </div>

      <form (submit)="submit($event)">
        <div class="form-group">
          <input
            placeholder=" "
            type="email"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            [disabled]="loading" />
          <label>Email</label>
        </div>

        <div class="form-group" style="margin-bottom:24px">
          <input
            placeholder=" "
            type="password"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            [disabled]="loading" />
          <label>Password</label>
        </div>

        <button
          class="btn"
          type="submit"
          [disabled]="loading || !email.trim() || !password">
          @if (loading) {
            <span style="display:inline-flex; align-items:center; gap:8px">
              <span class="spin"></span>
              Signing in…
            </span>
          } @else {
            Sign in
          }
        </button>
      </form>
    </div>

    @if (apiEnv.isTest()) {
      <div class="test-mode-banner">
        <span class="pill" data-status="test">TEST MODE</span>
        <div style="font-size:var(--font-sm); font-weight:600; color:#fff; margin-top:8px">
          You are signing in against the test API
        </div>
      </div>
    }

    <div class="login-footer">
      Account management is handled through your SabeeApp PMS
    </div>

    <button
      class="secret-tap-target"
      type="button"
      aria-hidden="true"
      tabindex="-1"
      (click)="onSecretTap()"></button>

    @if (tapCounterMessage(); as msg) {
      <div class="tap-counter-toast">{{ msg }}</div>
    }

  </div>
</ion-content>

@if (errorOpen) {
  <div class="sheet-backdrop" (click)="dismissError()">
    <div class="sheet" (click)="$event.stopPropagation()">
      <div class="head">
        <h3>Sign in failed</h3>
        <button class="icon-btn" (click)="dismissError()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div style="margin-top: 16px; margin-bottom: 8px">
        <div style="font-size: var(--font-base); font-weight: 600; color: var(--ink-3); line-height: 1.5">
          {{ errorMessage }}
        </div>
      </div>
      <div style="margin-top: 24px">
        <button class="btn" (click)="dismissError()">Try again</button>
      </div>
    </div>
  </div>
}
