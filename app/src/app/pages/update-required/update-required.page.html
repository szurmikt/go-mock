<ion-content>
  <div class="login-page">
    <div class="login-body" style="justify-content: center; text-align: center">
      <img src="assets/app-icon.png" alt="SabeeApp Go"
        style="width: 96px; height: 96px; display: block; margin: 0 auto 40px; border-radius: 22px; box-shadow: 0 6px 20px rgba(0,128,255,0.35)" />
      <div style="font-size: 28px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; margin-bottom: 12px">
        {{ 'updateRequired.title' | tr }}
      </div>
      <div style="font-size: var(--font-base); font-weight: 600; color: var(--ink-4); line-height: 1.45; max-width: 320px; margin: 0 auto">
        {{ 'updateRequired.message' | tr }}
      </div>
    </div>
  </div>
</ion-content>
