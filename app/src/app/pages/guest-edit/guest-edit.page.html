<ion-content>
  <div class="page" style="background: var(--bg); display: flex; flex-direction: column">

    <div class="sub-header">
      <button class="back" (click)="back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <span class="title">Edit Guest</span>
    </div>

    @if (loading()) {
      <div style="display: flex; justify-content: center; padding-top: 48px">
        <span class="spin-primary" style="width: 28px; height: 28px; border-width: 3px"></span>
      </div>
    } @else if (error() && !guest()) {
      <div style="text-align: center; padding: 48px var(--pad); color: var(--ink-3); font-size: 15px; font-weight: 600">
        {{ error() }}
      </div>
    } @else {

      <div class="app-scroll" style="padding: 8px 16px calc(80px + env(safe-area-inset-bottom, 0px))">

        <h3 class="group-title" style="margin-top: 8px">Personal</h3>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.first_name" name="first_name" autocomplete="given-name" />
          <label>First name</label>
          <span class="form-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
          </span>
        </div>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.last_name" name="last_name" autocomplete="family-name" />
          <label>Last name</label>
          <span class="form-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
          </span>
        </div>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.maiden_name" name="maiden_name" />
          <label>Maiden full name</label>
          <span class="form-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
          </span>
        </div>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.mother_name" name="mother_name" />
          <label>Mother's full name</label>
          <span class="form-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
          </span>
        </div>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.birth_date" name="birth_date" type="date" />
          <label>Birth Date</label>
          <span class="form-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
        </div>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.birth_place" name="birth_place" />
          <label>Birth place</label>
        </div>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.citizenship" name="citizenship" />
          <label>Citizenship</label>
        </div>

        <h3 class="group-title">Contact Details</h3>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.phone_number" name="phone_number" type="tel" autocomplete="tel" />
          <label>Phone</label>
        </div>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.email" name="email" type="email" autocomplete="email" />
          <label>Email</label>
        </div>

        <h3 class="group-title">Travelling document</h3>

        <div class="form-group">
          <select [(ngModel)]="form.document_type" name="document_type">
            @for (dt of docTypes; track dt.value) {
              <option [value]="dt.value">{{ dt.label }}</option>
            }
          </select>
          <label>Document Type</label>
          <span class="form-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </span>
        </div>

        <div class="form-group">
          <input placeholder=" " [(ngModel)]="form.document_number" name="document_number" />
          <label>Document Number</label>
        </div>

      </div>

    }

  </div>
</ion-content>

<!-- Save footer fixed outside ion-content so it never scrolls -->
@if (!loading() && (guest() || !error())) {
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px env(safe-area-inset-bottom, 16px); background: var(--bg); border-top: 1px solid var(--line)">
    <button class="btn" (click)="save()" [disabled]="saving()">
      @if (saving()) {
        <span class="spin" style="width: 18px; height: 18px; border-width: 2.5px"></span>
      } @else {
        Save
      }
    </button>
  </div>
}
