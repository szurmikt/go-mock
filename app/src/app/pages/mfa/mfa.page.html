<ion-content>
  <div class="mfa-page">

    <div class="sub-header">
      <button class="back" (click)="router.navigate(['/login'])">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <span class="title">{{ 'login.mfaTitle' | tr }}</span>
    </div>

    <div style="padding: 48px var(--pad) 0; text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center">

      <div style="width:64px; height:64px; border-radius:50%; background:var(--primary-soft-bg); border:1.5px solid var(--primary-soft); display:inline-flex; align-items:center; justify-content:center; color:var(--primary); margin-bottom:20px">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M7 8h10M7 12h4"/>
        </svg>
      </div>

      <div style="font-size:var(--font-base); font-weight:600; color:var(--ink-3); line-height:1.5; margin-bottom:40px">
        {{ 'login.mfaSubtitle' | tr }}
      </div>

      <div class="otp-row" style="margin-bottom:20px">
        @for (d of digits; track $index) {
          @if ($index === 3) {
            <span class="otp-sep">·</span>
          }
          <input
            #digitInput
            [class]="'otp-digit' + (d ? ' filled' : '') + (hasError ? ' error' : '')"
            type="tel"
            inputmode="numeric"
            maxlength="1"
            [value]="d"
            [disabled]="loading"
            (input)="onInput($event, $index)"
            (keydown)="onKeydown($event, $index)"
            (paste)="$index === 0 ? onPaste($event) : null" />
        }
      </div>

      <div style="height:28px; display:flex; align-items:center; justify-content:center">
        @if (loading) {
          <span class="spin-primary"></span>
        } @else if (hasError) {
          <span>
            <span style="font-size:var(--font-sm); font-weight:700; color:var(--warn)">{{ 'login.mfaInvalidCode' | tr }} </span>
            <button (click)="retryError()" style="background:none; border:none; font-size:var(--font-sm); font-weight:700; color:var(--primary); cursor:pointer; padding:0; font-family:inherit">{{ 'login.tryAgain' | tr }}</button>
          </span>
        }
      </div>

    </div>
  </div>
</ion-content>
