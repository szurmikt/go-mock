<ion-app>
  @if (loading()) {
    <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg, #f9fafb);">
      <span class="spin-primary" style="width: 32px; height: 32px; border-width: 3px;"></span>
      @if (bootMessage()) {
        <div style="margin-top: 16px; font-size: var(--font-base); font-weight: 600; color: var(--ink-4);">
          {{ bootMessage()! | tr }}
        </div>
      }
    </div>
  } @else {
    <ion-router-outlet [animation]="slideTransition"></ion-router-outlet>
  }
  @if (biometric.sessionLocked() && auth.isAuthenticated()) {
    <app-lock-overlay />
  }
</ion-app>
