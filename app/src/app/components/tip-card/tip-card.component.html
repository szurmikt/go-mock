<div class="card tap-anim tappable" (click)="open.emit()"
  style="position: relative; display: flex; align-items: stretch; padding: 0; border-radius: 12px; overflow: hidden; min-height: 78px; height: 100%; box-sizing: border-box; cursor: pointer">

  <!-- Image — 30% width, full card height, matching the reference design exactly.
       The img is absolutely positioned (not width/height:100%) so its own intrinsic
       aspect ratio (the tip SVGs are viewBox 400x300, i.e. 4:3) can never inflate the
       row's height on a page with no explicit-height ancestor (e.g. the Help & Tips
       list) — percentage height on a statically-positioned img falls back to that
       intrinsic ratio when no definite containing-block height exists, which is what
       made the list cards render taller than Home's, where an explicit wrapper height
       happened to mask the same issue. -->
  <div style="width: 30%; flex-shrink: 0; align-self: stretch; position: relative; overflow: hidden">
    <img [src]="card.image" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block" />
  </div>

  <div style="flex: 1; min-width: 0; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; justify-content: center">
    <div style="display: flex; align-items: center; gap: 6px; min-width: 0">
      <span style="font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">
        {{ card.title }}
      </span>
      @if (card.featured) {
        <span style="flex-shrink: 0; background: var(--primary); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: 0.03em; padding: 2px 6px; border-radius: 4px">
          {{ 'helpTips.newBadge' | tr }}
        </span>
      }
      @if (variant === 'list' && unseen) {
        <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex-shrink: 0; display: inline-block"></span>
      }
    </div>
    <div style="font-size: 13px; color: var(--ink-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">
      {{ card.summary }}
    </div>
  </div>

  @if (variant === 'list') {
    <div style="display: flex; align-items: center; padding-right: 12px; flex-shrink: 0">
      <svg width="7" height="12" viewBox="0 0 7 12" fill="none" stroke="var(--ink-4)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l5 5-5 5"/>
      </svg>
    </div>
  }

  @if (variant === 'home') {
    <button (click)="onDismiss($event)" [attr.aria-label]="'helpTips.ariaDismiss' | tr"
      style="position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.85); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1">
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="var(--ink-3)" stroke-width="1.4" stroke-linecap="round">
        <path d="M0.5 0.5L8.5 8.5M8.5 0.5L0.5 8.5"/>
      </svg>
    </button>
  }
</div>
